---
- name: 업그레이드 후 검증
  hosts: all
  gather_facts: false
  connection: local

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/redfish.yml"

  tasks:
    - name: BMC 응답 회복까지 대기 (최대 10분)
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/redfish/v1/"
        method: GET
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
      register: bmc
      until: bmc.status == 200
      retries: 30
      delay: 20

    - name: 펌웨어 인벤토리 재조회
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/redfish/v1/UpdateService/FirmwareInventory"
        method: GET
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
      register: fw_after

    - ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: 업그레이드 후 firmware count={{ fw_after.json.Members | length }}"
