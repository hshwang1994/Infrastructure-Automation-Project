---
- name: 펌웨어 업그레이드
  hosts: all
  gather_facts: false
  connection: local

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/redfish.yml"

  tasks:
    - name: SimpleUpdate 호출 (실제 환경에서 ImageURI 지정)
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/redfish/v1/UpdateService/Actions/UpdateService.SimpleUpdate"
        method: POST
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
        body_format: json
        body:
          ImageURI: "http://image-server/firmware/bmc-latest.bin"
          TransferProtocol: HTTP
        status_code: [200, 202]
      register: update
      failed_when: false

    - ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: update status={{ update.status | default('unknown') }}"
