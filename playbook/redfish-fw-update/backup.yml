---
- name: BIOS 설정 백업
  hosts: all
  gather_facts: true
  connection: local

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/redfish.yml"

  tasks:
    - name: 현재 BIOS 설정 조회
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/redfish/v1/Systems/System.Embedded.1/Bios"
        method: GET
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
      register: bios
      changed_when: false

    - name: 백업 파일 저장 (workspace)
      ansible.builtin.copy:
        content: "{{ bios.json | to_nice_json }}"
        dest: "{{ lookup('env', 'REPO_ROOT') }}/artifacts/bios-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}.json"
      delegate_to: localhost
