---
- name: Pre-check — RHEL 9 환경 검증 + 호스트 정보 수집
  hosts: all
  gather_facts: true
  connection: ssh
  become: true

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/linux.yml"

  tasks:
    - name: RHEL 9 환경인지 확인
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'RedHat'
          - ansible_facts.distribution_major_version == '9'
        fail_msg: >-
          {{ inventory_hostname }} 는 RHEL 9 가 아님
          (현재: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})

    - name: 호스트 정보 출력
      ansible.builtin.debug:
        msg: |
          [{{ inventory_hostname }}]
          OS         : {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          Kernel     : {{ ansible_facts.kernel }}
          CPU vCPUs  : {{ ansible_facts.processor_vcpus }}
          MEM (MB)   : {{ ansible_facts.memtotal_mb }}
