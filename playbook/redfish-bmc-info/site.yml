---
- name: BMC Redfish 기본 정보 조회
  hosts: all
  gather_facts: false
  connection: local

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/redfish.yml"

  tasks:
    - ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/redfish/v1/Systems"
        method: GET
        user: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
      register: systems

    - ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ systems.json.Members | length }} systems"
