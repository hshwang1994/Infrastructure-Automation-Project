---
- name: tags 데모 — install / configure / verify
  hosts: all
  gather_facts: false
  connection: ssh

  tasks:
    - name: 작업 디렉토리 준비
      ansible.builtin.file:
        path: /tmp/tagdemo
        state: directory
        mode: '0755'
      tags: install

    - name: 설정 파일 배치
      ansible.builtin.copy:
        content: "key=value\n"
        dest: /tmp/tagdemo/app.conf
        mode: '0644'
      tags: configure

    - name: 설정 파일 존재 확인
      ansible.builtin.stat:
        path: /tmp/tagdemo/app.conf
      register: conf
      tags: verify

    - name: 결과 출력
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: app.conf exists={{ conf.stat.exists }}"
      tags: verify
