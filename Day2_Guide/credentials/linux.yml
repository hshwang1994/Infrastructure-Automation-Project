---
# linux target_type 자격증명 — vault/linux.yml 의 평문 원본.
# 값 변경 시 ./scripts/encrypt-vault.sh 로 vault/linux.yml 을 다시 만들어야 한다.
#
# ansible_become_password 는 sudo 비밀번호. 보통 ansible_password 와 동일하지만
# sudo 비번이 다른 환경이면 따로 값을 둘 수 있다.
#
# ansible_ssh_common_args 는 비밀이 아니지만 vault 와 같이 들고 다닌다 —
# linux 타깃에 SSH 붙을 때 필요한 client 측 옵션이라 자격증명과 묶어두는 게 운영상 편함.
#   -o UserKnownHostsFile=/dev/null
#     → agent 의 ~/.ssh/known_hosts 를 안 읽어서, 호스트키가 바뀐 타깃도 비번 인증 정상 통과.
#       (vault 비번 하나로 끝 — host 등록 절차 없음.)
#   -o StrictHostKeyChecking=no
#     → 처음 보는 호스트도 자동 진행.

ansible_user:            infra
ansible_password:        infra1234
ansible_become_password: infra1234
ansible_ssh_common_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
