---
# Builtin 데모 — ansible.builtin.copy 로 파일을 쓰는 "고수준 모듈" 방식.
# 멱등성·권한·소유자 모두 모듈이 알아서 처리한다.
- name: Builtin — ansible.builtin.copy 로 연습용 파일 작성
  hosts: all
  gather_facts: true
  connection: ssh
  become: true

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/linux.yml"

  vars:
    practice_file:    /tmp/practice.txt
    practice_message: "hello from sandbox"

  tasks:
    - name: 연습용 파일 작성 (ansible.builtin.copy)
      ansible.builtin.copy:
        content: "{{ practice_message }} ({{ ansible_date_time.iso8601 }})\n"
        dest:    "{{ practice_file }}"
        owner:   root
        group:   root
        mode:    '0644'

    - name: 작성 결과 출력
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ practice_file }} 작성 완료 (builtin module)"
