---
- name: 보안·중요 업데이트 설치
  hosts: all
  gather_facts: false
  connection: winrm

  vars_files:
    - "{{ lookup('env', 'REPO_ROOT') }}/vault/windows.yml"

  vars:
    ansible_winrm_transport:              ntlm
    ansible_winrm_scheme:                 http
    ansible_port:                         5985
    ansible_winrm_server_cert_validation: ignore

  tasks:
    - name: 업데이트 설치 (재부팅은 아래에서 별도 처리)
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        reboot: false
      register: update_result

    - name: 재부팅 필요 시 재부팅
      ansible.windows.win_reboot:
      when: update_result.reboot_required | default(false)

    - name: 설치 요약
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: 설치 {{ update_result.installed_update_count }}건,
          재부팅필요={{ update_result.reboot_required | default(false) }}
