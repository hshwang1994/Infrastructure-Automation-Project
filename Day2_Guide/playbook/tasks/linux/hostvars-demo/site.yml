---
- name: inventory_json 추가 필드를 hostvar 로 사용
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: 호스트별 추가 필드 출력
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          (ansible_host={{ ansible_host }})
          tier={{ tier }}
          patch_window={{ patch_window | default('미지정') }}

    - name: tier 가 db 인 호스트에서만 실행
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} 는 DB 계층 — 패치 전 백업 확인 필요"
      when: tier | default('') == 'db'
