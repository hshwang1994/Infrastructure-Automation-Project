---
- name: Check uptime
  ansible.builtin.command:
    cmd: uptime
  register: uptime_result
  changed_when: false
  failed_when: false

- name: Check sshd service state
  ansible.builtin.command:
    cmd: systemctl is-active sshd
  register: sshd_result
  changed_when: false
  failed_when: false

- name: Build portal records
  ansible.builtin.set_fact:
    portal_records: >-
      {{
        [
          {
            'timestamp': lookup('pipe', 'date +%Y%m%d%H%M%S'),
            'host_name': inventory_hostname,
            'host_addr': ansible_host | default(inventory_hostname),
            'role_name': role_name | default(''),
            'task_name': 'Check uptime',
            'original_value': none,
            'return_code': 'PASS'
              if (uptime_result.rc | default(1) | int) == 0
              else 'FAIL',
            'return_message': uptime_result.stdout
              | default(uptime_result.stderr | default('', true), true)
          },
          {
            'timestamp': lookup('pipe', 'date +%Y%m%d%H%M%S'),
            'host_name': inventory_hostname,
            'host_addr': ansible_host | default(inventory_hostname),
            'role_name': role_name | default(''),
            'task_name': 'Check sshd status',
            'original_value': sshd_result.stdout | default(none, true),
            'return_code': 'PASS'
              if (sshd_result.rc | default(1) | int) == 0
              else 'FAIL',
            'return_message': sshd_result.stdout
              | default(sshd_result.stderr | default('', true), true)
          }
        ]
      }}
