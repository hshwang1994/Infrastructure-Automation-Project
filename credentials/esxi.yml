---
# esxi target_type 자격증명 정의서
# Jenkins UI 에서 이 값을 그대로 Credentials 에 등록한다.

target_type: esxi

# 접속 계정 (현재: 사내 테스트용 임의 값)
username: infra
password: infra1234

# Ansible 매핑
# - ansible_user     ← username
# - ansible_password ← password (SSH 인증)

connection: ssh
become: false   # ESXi 는 일반적으로 root 권한이라 sudo 불필요

# Jenkins Credential ID
jenkins_credentials:
  - id: ansible-esxi-user
    kind: "Secret text"
    value_ref: username
  - id: ansible-esxi-pass
    kind: "Secret text"
    value_ref: password

notes: |
  운영 이행 시 보통 root 계정으로 교체된다. ESXi 의 ssh 데몬은 기본 off 이므로
  대상 ESXi 호스트에서 ssh 서비스가 활성화되어 있어야 한다.
