---
# redfish target_type 자격증명 정의서
# Jenkins UI 에서 이 값을 그대로 Credentials 에 등록한다.

target_type: redfish

# 접속 계정 (현재: 사내 테스트용 임의 값, 모든 vendor 통일)
username: infra
password: infra1234

# Ansible 매핑
# - ansible_user     ← username
# - ansible_password ← password (Redfish HTTPS Basic Auth)

connection: local   # BMC 에 HTTPS 로 직접 호출하므로 controller 에서 local 실행
become: false

# Jenkins Credential ID (현재: 모든 vendor 단일 ID)
jenkins_credentials:
  - id: ansible-redfish-user
    kind: "Secret text"
    value_ref: username
  - id: ansible-redfish-pass
    kind: "Secret text"
    value_ref: password

# 향후 vendor 별 분리가 필요해질 경우 (참고용 — 현재는 비활성)
future_vendor_split:
  enabled: false
  pattern:
    - id: "ansible-redfish-dell-user / -pass"
      use_for: dell (iDRAC)
    - id: "ansible-redfish-hpe-user / -pass"
      use_for: hpe (iLO)
    - id: "ansible-redfish-lenovo-user / -pass"
      use_for: lenovo (XCC)
    - id: "ansible-redfish-supermicro-user / -pass"
      use_for: supermicro (IPMI)

notes: |
  현재는 사내 테스트라 모든 vendor 가 같은 자격증명을 사용한다.
  운영에서 vendor 별 계정이 달라지면 future_vendor_split 의 패턴으로 분기 추가하고
  Jenkinsfile 의 credentialsId 를 vendor 기준으로 동적 선택하도록 수정해야 한다.
