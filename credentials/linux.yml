---
# linux target_type 자격증명 정의서
# Jenkins UI 에서 이 값을 그대로 Credentials 에 등록한다.

target_type: linux

# 접속 계정 (현재: 사내 테스트용 임의 값)
username: infra
password: infra1234

# Ansible 매핑
# - ansible_user            ← username
# - ansible_password        ← password (SSH 인증)
# - ansible_become_password ← password (sudo)

connection: ssh
become: true   # sudo 필요 시 (대부분의 운영 작업)

# Jenkins Credential ID
# (현재 가이드는 Secret text 2개로 분리 등록 — docs/jenkinsfile-guide.md 참고)
jenkins_credentials:
  - id: ansible-linux-user
    kind: "Secret text"
    value_ref: username
  - id: ansible-linux-pass
    kind: "Secret text"
    value_ref: password

notes: |
  운영 이행 시 username/password 만 교체 후 Jenkins UI 의 동일 ID 를
  업데이트하면 모든 linux 작업에 일괄 반영된다.
