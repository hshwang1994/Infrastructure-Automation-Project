# linux target_type 자격증명 — vault/linux.yml 의 평문 원본.
# 값 변경 시 ./scripts/encrypt-vault.sh 로 vault/linux.yml 을 다시 만들어야 한다.
#
# ansible_become_password 는 sudo 비밀번호. 보통 ansible_password 와 동일하지만
# sudo 비번이 다른 환경이면 따로 값을 둘 수 있다.

ansible_user:            infra
ansible_password:        infra1234
ansible_become_password: infra1234
