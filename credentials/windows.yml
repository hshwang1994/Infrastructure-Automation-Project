---
# windows target_type 자격증명 정의서
# Jenkins UI 에서 이 값을 그대로 Credentials 에 등록한다.

target_type: windows

# 접속 계정 (현재: 사내 테스트용 임의 값)
username: infra
password: infra1234

# Ansible 매핑
# - ansible_user     ← username
# - ansible_password ← password (WinRM 인증)

connection: winrm
become: false

# WinRM 추가 옵션 (비-시크릿, playbook vars 에 직접 작성)
winrm_options:
  ansible_winrm_transport: ntlm
  ansible_winrm_server_cert_validation: ignore
  ansible_port: 5985

# Jenkins Credential ID
jenkins_credentials:
  - id: ansible-windows-user
    kind: "Secret text"
    value_ref: username
  - id: ansible-windows-pass
    kind: "Secret text"
    value_ref: password

notes: |
  WinRM 옵션은 시크릿이 아니므로 이 파일에 평문 유지하고
  playbook 의 vars 블록에 그대로 옮긴다. docs/playbook-guide.md 의 windows 예시 참고.
